[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "decision-metrics"
version = "0.2.0"
description = "Traces, metrics, replay, and training data for decision models"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
license = "MIT"
keywords = ["decision-models", "telemetry", "opentelemetry", "benchmarking", "replay"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]

[project.optional-dependencies]
otel = ["opentelemetry-api>=1.20"]

[project.urls]
Repository = "https://github.com/banjtheman/decision-metrics"
Documentation = "https://github.com/banjtheman/decision-metrics#readme"
Issues = "https://github.com/banjtheman/decision-metrics/issues"

[project.scripts]
decision-metrics = "decision_metrics.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
