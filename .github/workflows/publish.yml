name: publish to PyPI
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to publish (for example, v0.1.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pypi-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Check version tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          if os.environ["RELEASE_TAG"] != f"v{version}":
              raise SystemExit("Release tag must match the version in pyproject.toml")
          PY
      - run: python -m pip install build twine opentelemetry-sdk
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - run: python -m pip install --no-deps dist/*.whl
      - run: python -c "import importlib.metadata, decision_metrics; assert decision_metrics.__version__ == importlib.metadata.version('decision-metrics')"
      - run: python -m unittest discover -s tests -v
      - run: decision-metrics demo --output output/release-demo.jsonl
      - run: python examples/support_routing.py --output output/release-support.jsonl
      - run: python examples/agent_tools.py --output output/release-tools.jsonl
      - run: decision-metrics export-training output/release-demo.jsonl --output output/release-review
      - run: decision-metrics export-training output/release-demo.jsonl --teacher-backend demo --format strands --output output/release-strands
      - uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/decision-metrics/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
