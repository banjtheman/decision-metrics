name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build twine opentelemetry-sdk
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - run: python -m pip install --no-deps dist/*.whl
      - run: python -c "import importlib.metadata, decision_metrics; assert decision_metrics.__version__ == importlib.metadata.version('decision-metrics')"
      - run: python -m unittest discover -s tests -v
      - run: decision-metrics demo --output output/ci-demo.jsonl
      - run: python examples/support_routing.py --output output/ci-support.jsonl
      - run: python examples/agent_tools.py --output output/ci-tools.jsonl
